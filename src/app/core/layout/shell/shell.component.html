<div class="shell">
    <main class="content">
        <router-outlet></router-outlet>
    </main>

    <nav class="dock">

        @for (item of menuItems; track item.route) {
            <a
                class="dock-item"
                [routerLink]="item.route"
                routerLinkActive="dock-item-active"
                #rla="routerLinkActive"
            >
                <mat-icon>{{ item.icon }}</mat-icon>
                <span class="dock-label">{{ item.label }}</span>
            </a>
        }

        @if (currentUser(); as user) {
            <button
                class="dock-item user-menu-trigger"
                [matMenuTriggerFor]="userMenu"
                #userMenuTrigger="matMenuTrigger"
                [class.dock-item-active]="userMenuTrigger.menuOpen"
            >
                <mat-icon>person</mat-icon>
                <span class="dock-label">Perfil</span>
            </button>

            <mat-menu #userMenu="matMenu" class="user-menu-panel" xPosition="before" yPosition="above">
                <div class="user-menu-header">
                    <mat-icon>person</mat-icon>
                    <span class="user-name">{{ userDisplayName() }}</span>
                </div>
                <mat-divider></mat-divider>
                <button mat-menu-item (click)="setTheme('light')">
                    <mat-icon>light_mode</mat-icon>
                    <span>Tema claro</span>
                    @if (theme() === 'light') {
                        <mat-icon class="user-menu-check">check</mat-icon>
                    }
                </button>
                <button mat-menu-item (click)="setTheme('dark')">
                    <mat-icon>dark_mode</mat-icon>
                    <span>Tema escuro</span>
                    @if (theme() === 'dark') {
                        <mat-icon class="user-menu-check">check</mat-icon>
                    }
                </button>
                <mat-divider></mat-divider>
                <button mat-menu-item (click)="logout()">
                    <mat-icon>logout</mat-icon>
                    <span>Sair</span>
                </button>
            </mat-menu>
        }
    </nav>
</div>
